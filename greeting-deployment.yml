apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeting-service
  template:
    metadata:
      labels:
        app: greeting-service
    spec:
      containers:
        - image: oumou23/greeting-service:1.0
          imagePullPolicy: IfNotPresent
          name: greeting-service
      restartPolicy: Always
