apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: greeting-service.info
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: greeting-service
                port:
                  number: 8080
